<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d4f1fb">
  <meta name="description" content="Cozy Tiles is a cosy sliding-tile puzzle. Slide the picture back together.">
  <title>Cozy Tiles</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="sky-bits" aria-hidden="true">
    <svg class="cloud-a" viewBox="0 0 180 80">
      <g fill="#ffffff">
        <ellipse cx="70" cy="48" rx="48" ry="26"/>
        <ellipse cx="110" cy="42" rx="40" ry="28"/>
        <ellipse cx="90" cy="30" rx="28" ry="22"/>
      </g>
    </svg>
    <svg class="cloud-b" viewBox="0 0 180 80">
      <g fill="#ffffff">
        <ellipse cx="70" cy="48" rx="48" ry="26"/>
        <ellipse cx="112" cy="44" rx="36" ry="24"/>
        <ellipse cx="88" cy="32" rx="26" ry="20"/>
      </g>
    </svg>
    <svg class="star-a" viewBox="0 0 32 32"><path d="M16 2l2.4 7.2H26l-6 4.6 2.2 7.2L16 16.8 9.8 21l2.2-7.2-6-4.6h7.6z" fill="#FFE08A"/></svg>
    <svg class="heart-a" viewBox="0 0 32 32"><path d="M16 27s-8-5-11-9.5C2 13 3 8 7 6.5 9.5 5.5 12 6.5 13.5 9 14.5 10.2 16 12 16 12s1.5-1.8 2.5-3C20 6.5 22.5 5.5 25 6.5 29 8 30 13 27 17.5 24 22 16 27 16 27z" fill="#FF9BB8"/></svg>
  </div>

  <div id="screen-home" class="screen active">
    <div class="sheet">
      <header class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="2" y="2" width="26" height="26" rx="8" fill="#7FD0EA"/>
          <rect x="36" y="2" width="26" height="26" rx="8" fill="#FFC2D4"/>
          <rect x="2" y="36" width="26" height="26" rx="8" fill="#FFE3A1"/>
          <rect x="36" y="36" width="26" height="26" rx="8" fill="none" stroke="#4468E6" stroke-width="3" stroke-dasharray="5 4"/>
        </svg>
        <h1 class="logo">Cozy <span>Tiles</span></h1>
        <p class="tagline">Slide the tiles. Tuck the picture back together.</p>
      </header>

      <article class="feature">
        <div class="feature-art">
          <img id="featured-img" alt="">
          <span class="pill">Tonight's scene</span>
        </div>
        <div class="feature-copy">
          <h2 id="featured-title"></h2>
          <p id="featured-place" class="place"></p>
          <p id="featured-caption" class="caption"></p>
        </div>
      </article>

      <button type="button" class="btn btn-primary" id="btn-play">Play this scene</button>
      <div class="nav-row">
        <button type="button" class="btn btn-quiet" id="btn-gallery">All scenes</button>
        <button type="button" class="btn btn-quiet" id="btn-moods">Moods</button>
      </div>
    </div>
  </div>

  <div id="screen-gallery" class="screen">
    <div class="sheet wide">
      <header class="screen-header">
        <button type="button" class="icon-btn" id="btn-gallery-back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2>All scenes</h2>
      </header>
      <div class="scene-grid" id="gallery-grid"></div>
    </div>
  </div>

  <div id="screen-moods" class="screen">
    <div class="sheet">
      <header class="screen-header">
        <button type="button" class="icon-btn" id="btn-moods-back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2>Moods</h2>
      </header>
      <div class="mood-list" id="mood-list"></div>
    </div>
  </div>

  <div id="screen-mood" class="screen">
    <div class="sheet wide">
      <header class="screen-header">
        <button type="button" class="icon-btn" id="btn-mood-back" aria-label="Back to moods">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="mood-title"></h2>
      </header>
      <p id="mood-blurb" class="blurb"></p>
      <div class="scene-grid" id="mood-grid"></div>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div class="sheet">
      <header class="game-header">
        <button type="button" class="icon-btn" id="btn-game-back" aria-label="Back to start">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="game-title-block">
          <h2 id="game-title"></h2>
          <p id="game-place" class="place"></p>
        </div>
        <button type="button" class="goal" id="btn-info" aria-label="Goal picture and story">
          <img id="game-reference" alt="">
          <span>Goal</span>
        </button>
      </header>

      <div class="board-wrap" id="board-wrap">
        <div id="puzzle-board" class="puzzle-board" role="application" aria-label="Sliding puzzle. Tap a tile next to the gap, or use the arrow keys."></div>
        <img id="solved-full" class="solved-full" alt="">
        <div id="peek-overlay" class="peek-overlay"></div>
      </div>

      <div class="size-toggle" role="group" aria-label="Puzzle size">
        <button type="button" class="size-btn" id="btn-grid-3" aria-pressed="false">Easy 3×3</button>
        <button type="button" class="size-btn" id="btn-grid-4" aria-pressed="true">Classic 4×4</button>
      </div>

      <div class="stats">
        <div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="stat-moves">0</span></div>
        <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="stat-time">0:00</span></div>
      </div>

      <div class="controls">
        <button type="button" class="btn btn-quiet" id="btn-hint">Hint</button>
        <button type="button" class="btn btn-quiet" id="btn-peek" aria-label="Hold to peek at the picture">Peek</button>
        <button type="button" class="btn btn-quiet" id="btn-shuffle">Shuffle</button>
      </div>

      <label class="check" for="chk-numbers">
        <input type="checkbox" id="chk-numbers">
        Show numbers
      </label>
    </div>
  </div>

  <div id="info-overlay" class="overlay hidden">
    <div class="info-panel" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <button type="button" class="icon-btn info-close" id="btn-close-info" aria-label="Close">&times;</button>
      <h2 id="info-title"></h2>
      <p id="info-place" class="place"></p>
      <p id="info-caption" class="caption"></p>
    </div>
  </div>

  <div id="win-overlay" class="overlay hidden">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="win-panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <svg class="floater f1" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27s-8-5-11-9.5C2 13 3 8 7 6.5 9.5 5.5 12 6.5 13.5 9 14.5 10.2 16 12 16 12s1.5-1.8 2.5-3C20 6.5 22.5 5.5 25 6.5 29 8 30 13 27 17.5 24 22 16 27 16 27z" fill="#FF9BB8"/></svg>
      <svg class="floater f2" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l2.6 8H27l-6.6 5 2.5 8L16 18.2 9.1 23l2.5-8L5 10h8.4z" fill="#FFE08A"/></svg>
      <svg class="floater f3" viewBox="0 0 64 40" aria-hidden="true"><g fill="#D7F4FC" stroke="#8FB4D4" stroke-width="2"><ellipse cx="22" cy="26" rx="14" ry="9"/><ellipse cx="40" cy="24" rx="16" ry="11"/><ellipse cx="30" cy="16" rx="12" ry="9"/></g></svg>
      <svg class="floater f4" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l2 6h6l-5 4 2 6-5-3.5L11 19l2-6-5-4h6z" fill="#7FD0EA"/></svg>
      <svg class="floater f5" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27s-8-5-11-9.5C2 13 3 8 7 6.5 9.5 5.5 12 6.5 13.5 9 14.5 10.2 16 12 16 12s1.5-1.8 2.5-3C20 6.5 22.5 5.5 25 6.5 29 8 30 13 27 17.5 24 22 16 27 16 27z" fill="#FFC2D4"/></svg>
      <h2 class="win-title" id="win-title">All tucked in</h2>
      <div class="win-img-wrap">
        <img id="win-img" class="win-img" alt="">
      </div>
      <p id="win-name" class="win-name"></p>
      <p id="win-stats" class="win-stats"></p>
      <p id="win-streak" class="win-streak hidden"></p>
      <p id="win-best" class="win-best hidden">New personal best</p>
      <div class="win-actions">
        <button type="button" class="btn btn-primary" id="btn-again">Play again</button>
        <div class="win-row">
          <button type="button" class="btn btn-quiet" id="btn-next">Next scene</button>
          <button type="button" class="btn btn-quiet" id="btn-win-home">Home</button>
        </div>
        <button type="button" class="btn btn-ghost" id="btn-share">Share</button>
      </div>
    </div>
  </div>

  <p id="live" class="sr-only" aria-live="polite"></p>

  <script src="js/shuffle.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
