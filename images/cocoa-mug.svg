<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Cocoa Cloud</title>
  <desc>Original illustration for Cozy Tiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5F3FB"/><stop offset="0.62" stop-color="#FFF4EA"/><stop offset="1" stop-color="#F3D2B8"/></linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7f97b8" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <ellipse cx="400" cy="700" rx="360" ry="70" fill="#F3D2B8" stroke="#4E5D80" stroke-width="7"/>
  <path d="M90.0,82.0 L94.3,95.7 L108.0,100.0 L94.3,104.3 L90.0,118.0 L85.7,104.3 L72.0,100.0 L85.7,95.7Z" fill="#FFE7A8"/>
  <path d="M700.0,66.0 L703.4,76.6 L714.0,80.0 L703.4,83.4 L700.0,94.0 L696.6,83.4 L686.0,80.0 L696.6,76.6Z" fill="#FFE7A8"/>
  <g transform="translate(140.0,180.0) scale(1.300)"><path d="M0,5.2 C0,5.2 -10.2,-0.6 -10.2,-6.2 C-10.2,-11 -5.6,-13.2 0,-8.6 C5.6,-13.2 10.2,-11 10.2,-6.2 C10.2,-0.6 0,5.2 0,5.2Z" fill="#FF9BB8" stroke="#4E5D80" stroke-width="2.46" stroke-linejoin="round"/></g>
  <!-- cookie -->
  <g filter="url(#soft)">
    <circle cx="130" cy="560" r="70" fill="#E0A36A" stroke="#4E5D80" stroke-width="7"/>
    <circle cx="108" cy="540" r="10" fill="#8D5A3B"/>
    <circle cx="150" cy="548" r="9" fill="#8D5A3B"/>
    <circle cx="124" cy="580" r="8" fill="#8D5A3B"/>
    <circle cx="158" cy="586" r="7" fill="#8D5A3B"/>
  </g>
  <!-- spoon -->
  <g transform="rotate(28 680 600)">
    <rect x="668" y="560" width="18" height="130" rx="9" fill="#F2E2C8" stroke="#4E5D80" stroke-width="6"/>
    <ellipse cx="677" cy="548" rx="28" ry="34" fill="#FFF" stroke="#4E5D80" stroke-width="6"/>
  </g>
  <!-- mug -->
  <g filter="url(#soft)">
    <path d="M560,340 C690,330 700,560 560,560" fill="none" stroke="#4E5D80" stroke-width="46" stroke-linecap="round"/>
    <path d="M560,340 C660,350 668,530 560,560" fill="none" stroke="#FFF8F1" stroke-width="24" stroke-linecap="round"/>
    <rect x="210" y="250" width="360" height="330" rx="80" fill="#FFF8F1" stroke="#4E5D80" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="390" cy="270" rx="150" ry="36" fill="#8D5A3B" stroke="#4E5D80" stroke-width="7"/>
    <!-- cream -->
    <ellipse cx="340" cy="230" rx="54" ry="40" fill="#FFFFFF" stroke="#4E5D80" stroke-width="7"/>
    <ellipse cx="410" cy="214" rx="64" ry="48" fill="#FFFFFF" stroke="#4E5D80" stroke-width="7"/>
    <ellipse cx="470" cy="236" rx="46" ry="34" fill="#FFFFFF" stroke="#4E5D80" stroke-width="7"/>
    <!-- marshmallows -->
    <rect x="330" y="200" width="36" height="28" rx="8" fill="#FFC2D4" stroke="#4E5D80" stroke-width="5" transform="rotate(-8 348 214)"/>
    <rect x="430" y="206" width="32" height="26" rx="8" fill="#FFFFFF" stroke="#4E5D80" stroke-width="5" transform="rotate(10 446 219)"/>
    <!-- face -->
    <ellipse cx="320" cy="430" rx="22" ry="14" fill="#FFB4C8"/><ellipse cx="460" cy="430" rx="22" ry="14" fill="#FFB4C8"/>
    <path d="M316.4,390 Q338,403.5 359.6,390" fill="none" stroke="#4E5D80" stroke-width="6.75" stroke-linecap="round"/><path d="M420.4,390 Q442,403.5 463.6,390" fill="none" stroke="#4E5D80" stroke-width="6.75" stroke-linecap="round"/>
    <path d="M362,450 Q390,470 418,450" fill="none" stroke="#4E5D80" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(390.0,520.0) scale(1.600)"><path d="M0,5.2 C0,5.2 -10.2,-0.6 -10.2,-6.2 C-10.2,-11 -5.6,-13.2 0,-8.6 C5.6,-13.2 10.2,-11 10.2,-6.2 C10.2,-0.6 0,5.2 0,5.2Z" fill="#7FD0EA" stroke="#4E5D80" stroke-width="2.00" stroke-linejoin="round"/></g>
  </g>
  <!-- steam hearts -->
  <g transform="translate(330.0,140.0) scale(1.150)"><path d="M0,5.2 C0,5.2 -10.2,-0.6 -10.2,-6.2 C-10.2,-11 -5.6,-13.2 0,-8.6 C5.6,-13.2 10.2,-11 10.2,-6.2 C10.2,-0.6 0,5.2 0,5.2Z" fill="#FFFFFF" stroke="#4E5D80" stroke-width="2.78" stroke-linejoin="round"/></g>
  <g transform="translate(450.0,100.0) scale(1.400)"><path d="M0,5.2 C0,5.2 -10.2,-0.6 -10.2,-6.2 C-10.2,-11 -5.6,-13.2 0,-8.6 C5.6,-13.2 10.2,-11 10.2,-6.2 C10.2,-0.6 0,5.2 0,5.2Z" fill="#D7F4FC" stroke="#4E5D80" stroke-width="2.29" stroke-linejoin="round"/></g>
  <path d="M560.0,148.0 L562.9,157.1 L572.0,160.0 L562.9,162.9 L560.0,172.0 L557.1,162.9 L548.0,160.0 L557.1,157.1Z" fill="#fff"/>

</svg>
